<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teddy Day 🧸</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- 💖 EXTRA LOVE START -->
<section class="page active" id="startLove">
  <h2 class="quote">Click for extra love 💕</h2>
  <button onclick="startLove()">Start</button>
</section>

<!-- 🧸 INTRO -->
<section class="page" id="intro">
  <img src="memories/teddy.png" class="teddy">
  <p class="soft">Deepika… this teddy is for you 🤍</p>
  <button onclick="start()">Tap the Teddy</button>
</section>

<section class="page" id="hug">
  <img src="memories/teddy.png" class="teddy hug">
  <p class="quote">Whenever you miss me, hug this teddy… it’s me.</p>
</section>

<section class="page" id="days">
  <p class="days-text"></p>
  <button onclick="goTo('memoriesPage')">Continue</button>
</section>

<section class="page" id="memoriesPage">
  <img id="memoryImg" class="memory">
  <p id="memoryQuote" class="quote"></p>
  <button onclick="nextMemory()">Next</button>
</section>

<section class="page" id="game">
  <p class="quote">Find my teddy 🧸</p>
  <div class="cards"></div>
  <p id="gameMsg" class="quote"></p>
</section>

<section class="page" id="final">
  <img src="memories/teddy.png" class="teddy">
  <p class="final-line fade-in">
    You are not a moment — you are a direction.
  </p>
</section>

<script src="script.js"></script>
</body>
</html>
