<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teddy Day 🧸</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- START -->
<section class="page active" id="startLove">
  <h2 class="quote vibrant">Click for extra love 💕</h2>
  <button onclick="startLove()">Start</button>
</section>

<!-- INTRO -->
<section class="page" id="intro">
  <img src="memories/teddy.png" class="teddy clickable" onclick="start()">
  <p class="soft">Tap the teddy 🤍</p>
</section>

<!-- HUG -->
<section class="page" id="hug">
  <img src="memories/teddy.png" class="teddy hug">
  <p class="quote vibrant">Whenever you miss me, hug this teddy… it’s me.</p>
</section>

<!-- DAYS -->
<section class="page" id="days">
  <p class="days-text vibrant"></p>
  <button onclick="goTo('memoriesPage')">Continue</button>
</section>

<!-- MEMORIES -->
<section class="page" id="memoriesPage">
  <img id="memoryImg" class="memory">
  <p id="memoryQuote" class="quote vibrant"></p>
  <button onclick="nextMemory()">Next</button>
</section>

<!-- GAME -->
<section class="page" id="game">
  <p class="quote vibrant">Find my teddy 🧸</p>
  <div class="cards"></div>
  <p id="gameMsg" class="quote vibrant"></p>
</section>

<!-- FINAL -->
<section class="page" id="final">
  <img src="memories/teddy.png" class="teddy">
  <p class="final-line fade-in vibrant">
    You are not a moment — you are a direction.
  </p>
  <button onclick="restart()">Want to experience again? 😝</button>
</section>

<script src="script.js"></script>
</body>
</html>
